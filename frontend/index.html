<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mockup Generator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Mockup Generator</h1>
    </header>
    <main>
        <section id="mockup-display-area" class="active-template-template1">
            <img id="mockup-wallpaper-image" src="#" alt="User's wallpaper" style="display: none; max-width: 100%; max-height: 100%;">
        </section>
        <section id="template-selection-area">
            <button data-template="template1">Template 1</button>
            <button data-template="template2">Template 2</button>
            <button data-template="no-border">No Border</button>
        </section>
        <section id="customization-controls-area">
            <label for="color1">Color 1:</label>
            <input type="color" id="color1" name="color1" value="#FF0000">

            <label for="color2">Color 2:</label>
            <input type="color" id="color2" name="color2" value="#00FF00">

            <label for="color3">Color 3:</label>
            <input type="color" id="color3" name="color3" value="#0000FF">

            <label for="color4">Color 4:</label>
            <input type="color" id="color4" name="color4" value="#FFFF00">

            <label for="color5">Color 5:</label>
            <input type="color" id="color5" name="color5" value="#FF00FF">
        </section>
        <section id="image-upload-area">
            <label for="wallpaper-upload">Upload Wallpaper:</label>
            <input type="file" id="wallpaper-upload" accept="image/*">
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
